identifier: wasm_node
name: WebAssembly on a Node.js host
type: sim
arch: wasm
simulation:
  - name: custom
toolchain:
  - wasm-clang
ram: 1024
testing:
  # Not in the default set: every build needs this module's toolchain flags.
  default: false
supported:
  - gpio
  - entropy
  - flash
  - nvs
  - eeprom
