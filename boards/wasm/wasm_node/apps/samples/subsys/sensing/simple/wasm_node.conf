#
# As native_sim.conf: the bmi160 driver with its emulator, and no trigger.
#Enable BMI160 and BMI160 Emulator
CONFIG_BMI160_TRIGGER_NONE=y
CONFIG_EMUL_BMI160=y
CONFIG_SENSOR=y
CONFIG_SENSOR_INFO=y
CONFIG_EMUL=y

# native_sim logs in immediate mode by default (LOG_MODE_IMMEDIATE if
# ARCH_POSIX), and this sample's start-up logs more than the deferred
# buffer holds, the line upstream checks for among what is dropped.
CONFIG_LOG_MODE_IMMEDIATE=y
