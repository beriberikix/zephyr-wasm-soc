#
# native_sim logs in immediate mode by default (LOG_MODE_IMMEDIATE if
# ARCH_POSIX), and this sample's timings assume it. Deferred, the log
# thread's one-second wake-up after each message falls inside every sleep,
# so no power state's residency is ever met.
CONFIG_LOG_MODE_IMMEDIATE=y
