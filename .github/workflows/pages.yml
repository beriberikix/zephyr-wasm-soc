# SPDX-License-Identifier: Apache-2.0
#
# Build the port from scratch and publish the browser demo.
#
# This is also the honest reproducibility check: the workflow starts from a
# bare Ubuntu runner with none of the author's machine, applies the patches,
# builds five applications, runs three of them under Node, and only then
# publishes. If it is green, the README's instructions work.
name: build and publish demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the module
        uses: actions/checkout@v4
        with:
          path: zephyr-wasm

      - name: Install the toolchain
        env:
          LLVM_VERSION: '21'
        run: |
          set -e
          sudo apt-get update
          # binaryen gives wasm-opt for Asyncify; wabt gives the
          # wasm2wat/wat2wasm pair the safepoint pass round-trips through.
          sudo apt-get install -y --no-install-recommends \
            binaryen wabt ninja-build cmake python3-pip lsb-release wget software-properties-common gnupg

          # Ubuntu's own clang is 18, and this port is developed against 23.
          # Pin a recent LLVM from apt.llvm.org rather than quietly testing a
          # toolchain the README does not claim to support: on 18 the linker
          # leaves the iterable-section bounds undefined, so the renaming half
          # of the section scheme silently stops working.
          #
          # clang and lld must be the same version, because the clang driver
          # spawns wasm-ld by name.
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends "lld-$LLVM_VERSION"

          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
          "/usr/lib/llvm-$LLVM_VERSION/bin/clang" --version | head -1
          "/usr/lib/llvm-$LLVM_VERSION/bin/wasm-ld" --version
          wasm-opt --version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up the west workspace
        run: |
          pip install --break-system-packages west
          west init -l zephyr-wasm
          # Blobless and shallow: the tree is large and only one commit is used.
          west update --narrow -o=--filter=blob:none
          pip install --break-system-packages -r zephyr/scripts/requirements-base.txt

      - name: Apply the patches to Zephyr
        run: ./zephyr-wasm/scripts/apply_patches.sh

      - name: Build the demo
        run: ./zephyr-wasm/scripts/stage_site.sh

      # Every build in the manifest, against the output scripts/apps.json says
      # it should produce. The list used to live here and covered three of the
      # five; the timeslice test, which is the only one with a self-checking
      # PASS line, was built on every run and never executed.
      - name: Check the builds actually run
        run: node zephyr-wasm/scripts/check_site.mjs _site

      - name: Check two runs are identical
        run: ./zephyr-wasm/scripts/check_determinism.sh _site/m/sem.wasm --max-time 60000

      # The second engine. run_wasmtime.py is a separate implementation of the
      # same ABI, so the two agreeing is what the engine-neutrality claim
      # rests on -- and it was a measurement taken once rather than a check.
      - name: Check the two engines agree
        run: |
          pip install --break-system-packages wasmtime
          ./zephyr-wasm/scripts/check_engines.sh _site/m/sem.wasm --max-time 60000

      # The page is the product, so it is checked in a browser rather than
      # only under Node. Chromium runs every non-interactive build and reads
      # the output back through the page's own terminal.
      - name: Check the page in a browser
        run: |
          npm install --no-save playwright@1.56
          npx playwright install --with-deps chromium
          node zephyr-wasm/scripts/check_browser.mjs _site

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
