CONFIG_NET_L2_ETHERNET=y
# The resolver has one server slot by default. A sample that sets a static
# DNS server (big_http_download's 192.0.2.2) fills it, and the server DHCP
# offers then has no slot: every lookup goes to the static one and times out.
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
