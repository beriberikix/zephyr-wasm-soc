# SPDX-License-Identifier: Apache-2.0
#
# A download's speed is its receive window over the round trip, and a relay
# is hundreds of milliseconds away: upstream's big_http_download asks for a
# 5 KiB window, which gave 16 KB/s through relaynet and 280 KB/s on loopback.
# 32 KiB is about 140 KB/s at 230 ms, under relaynet's 64 KiB per round trip
# and 1 MiB/s per session. The buffers have to hold a full window (128 bytes
# each, 320 of them), or the window is advertised and not honoured.
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=32768
CONFIG_NET_BUF_RX_COUNT=320
CONFIG_NET_PKT_RX_COUNT=32
