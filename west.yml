# SPDX-License-Identifier: Apache-2.0
# West manifest for the arch/wasm Zephyr proof of concept.
#
# This repo (zephyr-wasm) is both the manifest repo and the out-of-tree
# Zephyr module that provides arch/wasm, soc/wasm/node and board wasm_node.
#
# Zephyr is pinned to a main commit rather than a release tag so the port is
# developed against the same tree the design notes were written from.
# Zephyr modules are imported narrowly: only the ones something here uses,
# at the revisions Zephyr itself pins, so they move with the Zephyr pin. The
# port uses the minimal libc and needs no HAL, and a full import would pull in
# hundreds of megabytes of vendor code for nothing.

manifest:
  self:
    path: zephyr-wasm

  # Zephyr's manifest leaves its optional modules out. Two of them are in
  # the allowlist below, so the group is turned back on; the allowlist still
  # decides which projects there are.
  group-filter: [+optional]

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: upstream
      revision: e201b84b04e4fab1844658e71da0b7e340f1cc82
      path: zephyr
      # Without this, `west build` is not available in the workspace.
      west-commands: scripts/west-commands.yml
      import:
        # The file systems upstream's storage samples use (ROADMAP Phase 3),
        # and the graphics library its display samples use (Phase 4).
        name-allowlist:
          - fatfs
          - littlefs
          - lvgl
          # A full C library (ROADMAP "Two levers"): the minimal libc cannot
          # build C++, POSIX or anything that wants string.h beyond the basics.
          - picolibc
          # TLS, DTLS and PSA crypto (ROADMAP Phase 6). Zephyr's mbedTLS is
          # two modules: the TLS library, and the crypto it is built on.
          - mbedtls
          - tf-psa-crypto
          # Libraries whose samples upstream runs on any board: DSP filters,
          # and protocol buffers. nanopb generates its C from a .proto at
          # build time, so the build also needs protoc (grpcio-tools).
          - cmsis-dsp
          - nanopb
          # SyS-T, the MIPI trace format the logging/syst sample writes.
          - mipi-sys-t
          # Two C++ libraries upstream's samples use, from Zephyr's optional
          # modules: TensorFlow Lite for Microcontrollers and Android's
          # Context Hub runtime. Both need a full C++ library, which comes
          # from the wasm32 sysroot (DESIGN.md D13).
          - tflite-micro
          - chre
